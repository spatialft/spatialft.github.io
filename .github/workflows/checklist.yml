name: Generate Checklist

on:
  push:
    branches: [main]
    paths:
      - REQUIREMENTS_CHECKLIST.md
      - scripts/generate_checklist.py
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/generate_checklist.py
      - name: Deploy to gh-pages
        run: |
          cp docs/checklist/index.html /tmp/checklist.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -f -b gh-pages origin/gh-pages
          mkdir -p checklist
          cp /tmp/checklist.html checklist/index.html
          git add checklist/index.html
          git diff --cached --quiet || git commit -m "regen checklist"
          git push origin gh-pages
