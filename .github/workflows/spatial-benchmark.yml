name: Validate Scores

# Runs on manual trigger or when static score files change.
# No live inference — the authoritative accuracy numbers are in scores.json,
# produced by the training pipeline (notebooks/04_eval_comparison.ipynb).
on:
  push:
    branches: [main]
    paths:
      - 'results/baseline/scores.json'
      - 'results/finetuned/scores.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Quality gate
        run: |
          python - <<'EOF'
          import json, sys

          base     = json.load(open("results/baseline/scores.json"))
          finetuned = json.load(open("results/finetuned/scores.json"))

          base_acc = base.get("accuracy", 0)
          ft_acc   = finetuned.get("accuracy", 0)

          print(f"Baseline accuracy:   {base_acc:.1%}")
          print(f"Fine-tuned accuracy: {ft_acc:.1%}")

          if ft_acc <= 0.125:
              print("FAIL: fine-tuned accuracy at or below random baseline (12.5%)", file=sys.stderr)
              sys.exit(1)

          if ft_acc < base_acc:
              print(f"WARN: fine-tuned ({ft_acc:.1%}) below baseline ({base_acc:.1%})")

          print("OK")
          EOF
