name: Deploy

on:
  push:
    branches: [main]
    paths:
      - scripts/generate_index.py
      - scripts/generate_benchmark.py
      - scripts/shared.py
      - scripts/templates/**
      - results/baseline/scores.json
      - results/finetuned/scores.json
      - results/finetuned/training_stats.json
      - results/examples.json
      - results/live/**
      - docs/assets/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync result images to docs/assets
        run: |
          cp -f results/comparison.png docs/assets/comparison.png 2>/dev/null || true
          cp -f results/finetuned/loss_curve.png docs/assets/loss-curve.png 2>/dev/null || true
      - run: python3 scripts/generate_index.py
      - run: python3 scripts/generate_benchmark.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
